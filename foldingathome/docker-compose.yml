---
services:
  foldingathome:
    image: lscr.io/linuxserver/foldingathome:latest
    container_name: foldingathome
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Vienna}
      - ACCOUNT_TOKEN=${ACCOUNT_TOKEN}
      - MACHINE_NAME=${MACHINE_NAME:-hazardousbox01}
      - CLI_ARGS=${CLI_ARGS:-}
    volumes:
      - ./data:/config
    restart: unless-stopped
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.http.routers.folding-at-home.entrypoints=http"
      - "traefik.http.routers.folding-at-home.rule=Host(`folding-at-home.ahwz.dev`)"
      - "traefik.http.middlewares.folding-at-home-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.folding-at-home.middlewares=folding-at-home-https-redirect"
      - "traefik.http.routers.folding-at-home-secure.entrypoints=https"
      - "traefik.http.routers.folding-at-home-secure.rule=Host(`folding-at-home.ahwz.dev`)"
      - "traefik.http.routers.folding-at-home-secure.tls=true"
      - "traefik.http.routers.folding-at-home-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.folding-at-home-secure.service=folding-at-home"
      - "traefik.http.services.folding-at-home.loadbalancer.server.port=7396"
      - "traefik.http.routers.folding-at-home-secure.middlewares=authelia@docker"

networks:
  public:
    external: true
